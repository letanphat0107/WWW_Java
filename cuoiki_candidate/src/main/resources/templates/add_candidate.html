<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>Add Candidate</h1>
    <form th:action="@{/candidate/save}" th:object="${candidate}" method="post">
      <input type="hidden" th:field="*{id}">
      <label for="fullname">Fullname</label>
      <input type="text" id="fullname" th:field="*{fullname}" required autofocus>
      <label for="email">Email</label>
      <input type="email" id="email" th:field="*{email}" required>
      <label for="phone">Phone</label>
      <input type="text" id="phone" th:field="*{phone}" required>
      <button type="submit">Save</button>
    </form>
    <a href="/candidate/list">Back to Candidates</a>
</body>
</html>
