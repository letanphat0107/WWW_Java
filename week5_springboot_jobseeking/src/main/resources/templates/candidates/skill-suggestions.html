<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đề Xuất Kỹ Năng</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    h2 {
      color: #007bff;
    }

    .list-group-item {
      font-size: 1.1em;
      margin: 5px 0;
      padding: 10px;
    }

  </style>
</head>
<body>
<!-- Thanh Điều Hướng -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Trang Chủ</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="/candidate/profile">Thông Tin Cá Nhân</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/candidate/job-suggestions">Gợi Ý Công Việc</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="/candidate/skill-suggestions">Đề Xuất Kỹ Năng</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/logout">Đăng Xuất</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Nội dung -->
<div class="container mt-4">
  <h2>Đề Xuất Kỹ Năng Cần Học</h2>
  <p>Danh sách các kỹ năng mà bạn chưa có. Bạn nên xem xét học các kỹ năng này để tăng cơ hội làm việc:</p>
  <ul class="list-group">
    <th:block th:each="skill : ${suggestedSkills}">
      <li class="list-group-item" th:text="${skill.skillName}"></li>
    </th:block>
  </ul>
</div>
</body>
</html>
