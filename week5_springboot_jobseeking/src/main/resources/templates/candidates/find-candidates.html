<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tìm Ứng Viên & Gửi Mail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h1>Tìm Các Ứng Viên Phù Hợp</h1>
  <h3>Chúng tôi đã tìm thấy các ứng viên có kỹ năng phù hợp với công việc của bạn:</h3>

  <form action="/candidate/send-invites" method="post">
    <div class="list-group">
      <th:block th:each="candidate : ${candidates}">
        <div class="list-group-item">
          <h5 th:text="${candidate.fullName}">Ứng viên</h5>
          <p>Email: <span th:text="${candidate.email}">Email ứng viên</span></p>
          <p>Điện thoại: <span th:text="${candidate.phone}">Số điện thoại</span></p>
          <input type="checkbox" name="candidateIds" th:value="${candidate.id}" /> Mời ứng viên này
        </div>
      </th:block>
    </div>

    <button type="submit" class="btn btn-primary mt-3">Gửi Email Mời</button>
  </form>

  <p th:text="${message}" class="mt-3"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
