<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="css/styles.css">

    <style type="text/css">
        /* To ensure the layout fits well on all screen sizes */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Background and container styling */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(45deg, #4e73df, #1cc88a); /* Gradient background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        /* Center the login form and style */
        .login-container {
            background-color: rgba(255, 255, 255, 0.9); /* Semi-transparent white background */
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Title style */
        h1 {
            color: #1cc88a;
            font-size: 28px;
            margin-bottom: 20px;
        }

        /* Form elements */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            color: #1cc88a;
            font-size: 14px;
            margin-bottom: 5px;
            display: block;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        input:focus {
            outline: none;
            border-color: #4e73df; /* Blue border on focus */
        }

        /* Submit button style */
        button {
            width: 100%;
            padding: 10px;
            background-color: #4e73df;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2e59d9; /* Darker blue when hovered */
        }

        /* Link style */
        .register-link {
            color: #4e73df;
            text-decoration: none;
            font-size: 14px;
            margin-top: 10px;
        }

        .register-link:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>
<div class="login-container">
    <h1>Đăng nhập</h1>
    <form action="/login" method="post" class="login-form">
        <div class="form-group">
            <label for="username">Tên đăng nhập:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Mật khẩu:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn">Đăng nhập</button>
    </form>
    <p><a href="/register" class="register-link">Đăng ký tài khoản</a></p>
</div>
</body>
</html>
