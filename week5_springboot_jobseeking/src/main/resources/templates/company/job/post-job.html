<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Tin Tuyển Dụng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">JobPortal</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="/jobs/post-job">Đăng Tin Tuyển Dụng</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/main">Trang Chủ</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <h1>Đăng Tin Tuyển Dụng</h1>
  <form action="/jobs/post-job" method="POST">
    <div class="mb-3">
      <label for="jobName" class="form-label">Tên Công Việc</label>
      <input type="text" class="form-control" id="jobName" name="jobName" required>
    </div>
    <div class="mb-3">
      <label for="jobDesc" class="form-label">Mô Tả Công Việc</label>
      <textarea class="form-control" id="jobDesc" name="jobDesc" rows="3" required></textarea>
    </div>

    <h3>Chọn Kỹ Năng</h3>
    <div class="mb-3">
      <label for="skills" class="form-label">Kỹ Năng Cần Thiết</label>
      <div id="skills">
        <!-- Sử dụng Thymeleaf để lặp qua danh sách kỹ năng -->
        <th:block th:each="skill : ${skills}">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="selectedSkillIds"
                   th:value="${skill.id}" id="skill_${skill.id}">
            <label class="form-check-label" th:for="'skill_' + ${skill.id}">
              <span th:text="${skill.skillName}"></span>
            </label>
          </div>
        </th:block>
      </div>
    </div>



    <button type="submit" class="btn btn-primary">Đăng Tin</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
